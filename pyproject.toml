[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Call-Me-Mabe"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flake8>=7.4.1",
    "llm-sdk",
    "mypy>=2.4.1",
    "pydantic>=2.14.1",
]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }

[[tool.mypy.overrides]]
module = "llm_sdk"
ignore_missing_imports = true
follow_imports = "skip"